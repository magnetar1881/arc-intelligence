<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Whale Feed — Arc Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080d1a;--bg2:#0c1322;--bg3:#111b30;--bg4:#162040;
  --border:#1a2a45;--border2:#233660;--border3:#2d4278;
  --blue:#3b82f6;--blue2:#2563eb;--blue3:#60a5fa;--blue4:#93c5fd;
  --purple:#8b5cf6;--green:#10b981;--amber:#f59e0b;
  --text:#f1f5f9;--text2:#cbd5e1;--text3:#94a3b8;--muted:#64748b;--dim:#4a6080;
  --sans:'Space Grotesk',sans-serif;--mono:'JetBrains Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:100;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;background:rgba(8,13,26,0.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(59,130,246,0.12)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;text-decoration:none;color:var(--text)}
.logo-dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 0 10px var(--blue);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.nav-back{font-size:12px;color:var(--blue3);text-decoration:none;font-weight:600;display:flex;align-items:center;gap:4px;transition:color .15s}
.nav-back:hover{color:var(--blue4)}
.page{max-width:1000px;margin:0 auto;padding:24px 28px}
.page-title{font-size:20px;font-weight:700;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--text3);margin-bottom:20px}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{font-size:11px;background:var(--bg2);border:1px solid var(--border);color:var(--text3);padding:5px 12px;border-radius:6px;cursor:pointer;transition:all .15s;font-family:var(--sans)}
.filter-btn.active,.filter-btn:hover{background:rgba(59,130,246,.12);border-color:var(--blue2);color:var(--blue3)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.card-head{padding:13px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text3)}
.card-sub{font-size:10px;color:var(--dim)}
.w-item{padding:12px 20px;border-bottom:1px solid rgba(26,42,69,.6);display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;transition:background .15s;cursor:pointer}
.w-item:hover{background:rgba(59,130,246,.04)}
.w-item:last-child{border-bottom:none}
.w-token{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--blue3);margin-bottom:3px;display:flex;align-items:center;gap:6px}
.w-addr{font-family:var(--mono);font-size:11px;color:var(--dim)}
.w-amt{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--green);text-align:right}
.w-time{font-size:10px;color:var(--dim);text-align:right;margin-top:2px}
.tier{font-size:9px;font-family:var(--mono);padding:2px 5px;border-radius:3px}
.tier-L{background:rgba(245,158,11,.1);color:var(--amber);border:1px solid rgba(245,158,11,.2)}
.tier-S{background:rgba(59,130,246,.08);color:var(--blue3);border:1px solid rgba(59,130,246,.18)}
.load-more{width:100%;padding:12px;background:transparent;border:none;border-top:1px solid var(--border);color:var(--blue3);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:background .15s}
.load-more:hover{background:rgba(59,130,246,.06)}
.empty{padding:40px 20px;text-align:center;font-size:13px;color:var(--dim)}
.skeleton{background:linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 50%,var(--bg3) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:4px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-line{height:10px;margin-bottom:5px}.sk-line:last-child{width:55%;margin-bottom:0}
.sk-item{padding:12px 20px;border-bottom:1px solid rgba(26,42,69,.6)}
.tg-btn{position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#8b5cf6);display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 4px 16px rgba(37,99,235,.3);transition:transform .2s;z-index:99}
.tg-btn:hover{transform:translateY(-2px)}
.tg-btn svg{width:20px;height:20px;fill:white}
@media(max-width:768px){.page{padding:16px}.filters{gap:6px}}
</style>
</head>
<body>
<header>
  <a class="logo" href="/"><div class="logo-dot"></div>Arc Intelligence</a>
  <a class="nav-back" href="/">← Back</a>
</header>
<div class="page">
  <div class="page-title">🐋 Whale Feed</div>
  <div class="page-sub">Real-time large transfers on Arc network</div>
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn" onclick="setFilter('LARGE',this)">LARGE only</button>
    <button class="filter-btn" onclick="setFilter('STD',this)">STD only</button>
  </div>
  <div class="card">
    <div class="card-head">
      <span class="card-title">Transactions</span>
      <span class="card-sub" id="feed-time"></span>
    </div>
    <div id="whale-feed">
      <div class="sk-item"><div class="skeleton sk-line" style="width:38%"></div><div class="skeleton sk-line"></div></div>
      <div class="sk-item"><div class="skeleton sk-line" style="width:44%"></div><div class="skeleton sk-line"></div></div>
      <div class="sk-item"><div class="skeleton sk-line" style="width:36%"></div><div class="skeleton sk-line"></div></div>
      <div class="sk-item"><div class="skeleton sk-line" style="width:41%"></div><div class="skeleton sk-line"></div></div>
      <div class="sk-item"><div class="skeleton sk-line" style="width:39%"></div><div class="skeleton sk-line"></div></div>
    </div>
    <button class="load-more" id="load-more-btn" onclick="loadMore()">Load more</button>
  </div>
</div>
<a class="tg-btn" href="https://t.me/+PWV3AE5DuRgzMTk8" target="_blank" rel="noopener">
  <svg viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
</a>
<script>
function fmt(n){const v=Number(n);if(!isFinite(v)||v>1e18)return'—';if(v>=1e12)return(v/1e12).toFixed(2)+'T';if(v>=1e9)return(v/1e9).toFixed(2)+'B';if(v>=1e6)return(v/1e6).toFixed(2)+'M';if(v>=1e3)return(v/1e3).toFixed(1)+'K';return v.toFixed(2)}
function shortAddr(a){if(!a)return'—';return a.slice(0,6)+'...'+a.slice(-4)}
function timeAgo(ts){
  if(!ts)return'—';
  const d=new Date(ts.includes('T')||ts.includes('Z')?ts:ts+' UTC');
  const diff=Math.floor((Date.now()-d)/1000);
  if(diff<60)return diff+'s ago';
  if(diff<3600)return Math.floor(diff/60)+'m ago';
  if(diff<86400)return Math.floor(diff/3600)+'h ago';
  return Math.floor(diff/86400)+'d ago';
}

let allWhales=[];
let currentFilter='all';
let offset=0;
const PAGE=30;

function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderFeed();
}

function renderFeed(){
  const el=document.getElementById('whale-feed');
  let rows=allWhales;
  if(currentFilter==='LARGE')rows=rows.filter(w=>Number(w.amount)>=250000);
  if(currentFilter==='STD')rows=rows.filter(w=>Number(w.amount)<250000);
  if(!rows.length){el.innerHTML='<div class="empty">No transactions found.</div>';return}
  el.innerHTML=rows.slice(0,offset+PAGE).map(w=>{
    const large=Number(w.amount)>=250000;
    return`<div class="w-item">
      <div>
        <div class="w-token">${w.token}<span class="tier ${large?'tier-L':'tier-S'}">${large?'LARGE':'STD'}</span></div>
        <div class="w-addr">${shortAddr(w.wallet)}</div>
      </div>
      <div>
        <div class="w-amt">${fmt(w.amount)}</div>
        <div class="w-time">${timeAgo(w.timestamp)}</div>
      </div>
    </div>`;
  }).join('');
  const btn=document.getElementById('load-more-btn');
  if(offset+PAGE>=rows.length)btn.style.display='none';
  else btn.style.display='block';
}

function loadMore(){offset+=PAGE;renderFeed()}

async function init(){
  try{
    allWhales=await fetch('/api/whales?limit=500').then(r=>r.json());
    renderFeed();
    document.getElementById('feed-time').textContent='Updated '+new Date().toLocaleTimeString();
  }catch(e){}
}
init();
setInterval(async()=>{
  try{allWhales=await fetch('/api/whales?limit=500').then(r=>r.json());renderFeed();document.getElementById('feed-time').textContent='Updated '+new Date().toLocaleTimeString()}catch(e){}
},30000);
</script>
</body>
</html>
