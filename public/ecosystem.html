<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Arc Ecosystem — Arc Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080d1a;--bg2:#0c1322;--bg3:#111b30;--bg4:#162040;
  --border:#1a2a45;--border2:#233660;--border3:#2d4278;
  --blue:#3b82f6;--blue2:#2563eb;--blue3:#60a5fa;
  --purple:#8b5cf6;--green:#10b981;
  --text:#f1f5f9;--text2:#cbd5e1;--text3:#94a3b8;--muted:#64748b;--dim:#4a6080;
  --sans:'Space Grotesk',sans-serif;--mono:'JetBrains Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:100;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;background:rgba(8,13,26,0.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(59,130,246,0.12)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;text-decoration:none;color:var(--text)}
.logo-dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 0 10px var(--blue);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.nav-back{font-size:12px;color:var(--blue3);text-decoration:none;font-weight:600;transition:color .15s}
.nav-back:hover{color:var(--blue3)}
.page{max-width:1100px;margin:0 auto;padding:24px 28px}
.page-title{font-size:20px;font-weight:700;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--text3);margin-bottom:24px}
.disclaimer{background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.18);border-radius:8px;padding:10px 16px;font-size:12px;color:#d97706;margin-bottom:24px;display:flex;align-items:center;gap:8px}
.section{margin-bottom:32px}
.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title::before{content:'';display:block;width:3px;height:14px;background:linear-gradient(135deg,var(--blue2),var(--purple));border-radius:2px}
.eco-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.eco-card{background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:14px 16px;text-decoration:none;display:block;transition:all .2s}
.eco-card:hover{border-color:var(--blue2);background:var(--bg3);transform:translateY(-2px);box-shadow:0 4px 16px rgba(37,99,235,.12)}
.eco-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
.eco-url{font-size:10px;font-family:var(--mono);color:var(--dim);margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eco-desc{font-size:11px;color:var(--text3);line-height:1.5}
.eco-source{font-size:9px;color:var(--dim);margin-top:8px;display:flex;align-items:center;gap:4px}
.eco-source::before{content:'●';color:var(--green);font-size:7px}
.empty{padding:24px;text-align:center;font-size:13px;color:var(--dim)}
.tg-btn{position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#8b5cf6);display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 4px 16px rgba(37,99,235,.3);transition:transform .2s;z-index:99}
.tg-btn:hover{transform:translateY(-2px)}
.tg-btn svg{width:20px;height:20px;fill:white}
@media(max-width:768px){.page{padding:16px}.eco-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
</style>
</head>
<body>
<header>
  <a class="logo" href="/"><div class="logo-dot"></div>Arc Intelligence</a>
  <a class="nav-back" href="/">← Back</a>
</header>
<div class="page">
  <div class="page-title">🌐 Arc Ecosystem</div>
  <div class="page-sub">Official Arc ecosystem resources — DEXs, bridges, wallets, and more</div>
  <div class="disclaimer">⚠️ All resources sourced from arc.io/ecosystem. For reference only — always verify before transacting.</div>
  <div id="eco-content"><div class="empty">Loading...</div></div>
</div>
<a class="tg-btn" href="https://t.me/+PWV3AE5DuRgzMTk8" target="_blank" rel="noopener">
  <svg viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
</a>
<script>
const LABELS={dex:'DEX — Decentralized Exchanges',bridges:'Bridges — Cross-Chain Transfer',borrow_lend:'Borrow & Lend',wallets:'Wallets',rpc_providers:'RPC Providers',explorers:'Block Explorers',faucets:'Faucets',analytics:'Analytics',oracles:'Oracles',stablecoin_issuers:'Stablecoin Issuers'};

async function init(){
  try{
    const data=await fetch('/api/ecosystem').then(r=>r.json());
    const container=document.getElementById('eco-content');
    const keys=Object.keys(LABELS).filter(k=>data[k]?.length);
    if(!keys.length){container.innerHTML='<div class="empty">No ecosystem data found.</div>';return}
    container.innerHTML=keys.map(k=>{
      const items=data[k].filter(i=>i.status==='active');
      if(!items.length)return'';
      return`<div class="section">
        <div class="section-title">${LABELS[k]}</div>
        <div class="eco-grid">
          ${items.map(i=>`
            <a class="eco-card" href="${i.url}" target="_blank" rel="noopener">
              <div class="eco-name">${i.name}</div>
              <div class="eco-url">${i.url.replace('https://','')}</div>
              <div class="eco-desc">${i.description}</div>
              <div class="eco-source">${i.source==='arc.io/ecosystem'?'Official Arc listing':'Community'}</div>
            </a>`).join('')}
        </div>
      </div>`;
    }).join('');
  }catch(e){document.getElementById('eco-content').innerHTML='<div class="empty">Failed to load ecosystem data.</div>'}
}
init();
</script>
</body>
</html>
